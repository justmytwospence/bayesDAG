[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.8.3"]
build-backend = "hatchling.build"

[project]
name = "bayesdag"
version = "0.0.1"
description = "Shape-first, posterior-aware, interactive visualizations of PyMC models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Spencer Boucher" }]
keywords = ["pymc", "bayesian", "visualization", "anywidget", "graphical-model", "arviz"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pymc>=5",
    "arviz",
    "mini-racer>=0.12",  # in-process V8: runs ELK (the layout engine) AND MathJax. Core.
    "graphviz",          # `dot`: the explicit BAYESDAG_LAYOUT=dot opt-in / rollback only
    "networkx",
    "traitlets>=5",
]

# User-facing feature bundles (ship in the wheel): pip install "bayesdag[interactive]"
[project.optional-dependencies]
interactive = ["anywidget>=0.9", "ipywidgets>=8"]
math = ["mini-racer>=0.12"]
export = ["cairosvg"]
interop = ["prov"]
reparam = ["pymc-extras"]

# Dev tooling (PEP 735 groups; never published)
[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "ruff",
    "jupyterlab>=4",
    "marimo>=0.8",
    "watchfiles",
    "pymc-bart>=0.9.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/bayesdag/static/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/bayesdag"]

# Run the esbuild JS build during the PEP 517 build so the wheel ships the bundle.
[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/bayesdag/static/widget.js", "src/bayesdag/static/elk-worker.min.js"]
skip-if-exists = ["src/bayesdag/static/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.8.3"]
optional-editable-build = true

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs lists every skip in the summary: ~17% of the suite sits behind optional-dependency gates,
# and a silent skip reads exactly like a pass. Set BAYESDAG_REQUIRE_FULL=1 (CI does) to make
# those skips hard failures instead.
addopts = "-rs --strict-markers --strict-config"
