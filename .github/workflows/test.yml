name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - name: Install graphviz (the explicit BAYESDAG_LAYOUT=dot opt-in backend)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install JS deps (esbuild bundles widget + mathjax + elk)
        run: npm install
      - name: Sync Python env (builds the JS bundles via hatch-jupyter-builder)
        run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest
      - name: Build wheel (ensured-targets verifies the JS bundles shipped)
        run: uv build
